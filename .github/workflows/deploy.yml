name: Deploy Backend to AWS EC2

# main 브랜치에 push 될 때마다 이 스크립트가 실행됩니다!
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      # 1. 깃허브에 있는 최신 백엔드 코드와 도커 설정파일을 AWS 서버로 복사해서 보냅니다.
      - name: Copy Backend Files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: "server/,docker-compose.yml"
          target: "/home/ubuntu/judgment-day" # 폴더명 확인 완료

      # 2. AWS 서버에 원격 접속해서 예전 도커를 끄고, 최신 코드로 도커를 다시 켭니다!
      - name: Run Docker on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/judgment-day
            
            # (1) 낡은 버전의 docker-compose 대신 이미지를 직접 빌드 (노 캐시)
            sudo docker-compose build --no-cache backend
            
            # (2) 기존 컨테이너 강제 종료 및 삭제 (실패해도 무시하도록 || true 붙임)
            sudo docker rm -f judgment-day_backend_1 || true
            
            # (3) 성공했던 그 명령어 그대로 다시 띄우기
            sudo docker run -d \
              --name judgment-day_backend_1 \
              --network judgment-day_default \
              -p 4000:4000 \
              -e NODE_ENV=production \
              -v /home/ubuntu/judgment-day/server/.env:/app/.env \
              judgment-day_backend:latest